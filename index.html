<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.2 - Etiquetas de autocierre en HTML5</title>
</head>
<body>
    <h1>Etiquetas de autocierre by Mosab</h1>
    <h2>Etiqueta br</h2>
<p>Sirve para partir una línea dentro de un párrafo.<br>Aquí se ve el salto de línea.</p>
<h2>Etiqueta hr</h2>
<p>Sirve para separar bloques de texto con una línea horizontal.</p>
<hr>
<p>Texto después de la línea horizontal.</p>
</body>
</html>
